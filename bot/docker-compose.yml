version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: spacetraders-postgres
    environment:
      POSTGRES_DB: spacetraders
      POSTGRES_USER: spacetraders
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    # Matches gobot/docker-compose.yml, which is the file the live container is
    # actually created from (its volume is gobot_postgres_data). This twin
    # declares the same container_name, so a recreate from here would otherwise
    # silently reinstate the 64MB /dev/shm that broke parallel query and VACUUM.
    shm_size: 1g
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spacetraders"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
