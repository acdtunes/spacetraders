version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: spacetraders-prometheus
    ports:
      - "9091:9090"  # Use 9091 to avoid conflict with daemon's metrics port
    volumes:
      - ./gobot/configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./gobot/configs/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - metrics

  grafana:
    image: grafana/grafana:latest
    container_name: spacetraders-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./gobot/configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./gobot/configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      # The grafana_ro Postgres password, read by the datasource provisioning at
      # configs/grafana/provisioning/datasources/prometheus.yml. INTERPOLATED from
      # the environment (shell export, or a `.env` beside this file — .env is
      # gitignored); it must NEVER be written as a literal here. This repository
      # is public: a literal in a tracked compose file is published the moment it
      # merges, which is exactly how the credential in 1357c05c leaked.
      # Set the matching value on the role out of band:
      #   ALTER ROLE grafana_ro PASSWORD '<secret>';
      - GRAFANA_RO_PASSWORD=${GRAFANA_RO_PASSWORD}
    restart: unless-stopped
    networks:
      - metrics
    depends_on:
      - prometheus

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  metrics:
    driver: bridge
