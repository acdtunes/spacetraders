apiVersion: 1

# Staging datasources reuse the SAME uids (prometheus / postgresql) as prod so the
# unmodified prod dashboards render staging data — but point at staging targets: the
# staging Prometheus (this compose) and the spacetraders_staging database.
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://staging-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: PostgreSQL
    type: postgres
    access: proxy
    uid: postgresql
    url: host.docker.internal:5432
    database: spacetraders_staging
    user: spacetraders
    editable: false
    secureJsonData:
      password: dev_password
    jsonData:
      database: spacetraders_staging
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
