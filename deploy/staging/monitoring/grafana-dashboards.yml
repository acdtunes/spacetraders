apiVersion: 1

providers:
  - name: 'SpaceTraders Staging Dashboards'
    orgId: 1
    folder: 'SpaceTraders (staging)'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
