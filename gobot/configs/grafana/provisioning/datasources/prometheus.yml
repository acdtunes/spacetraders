apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: PostgreSQL
    type: postgres
    access: proxy
    uid: postgresql
    url: host.docker.internal:5432
    database: spacetraders
    # grafana_ro is SELECT-only and carries its own ceilings (statement_timeout
    # 20s, temp_file_limit 1GB, work_mem 4MB) from migration 057. Grafana shares
    # this instance with the tour planner, so the reader must not be able to
    # spend the planner's headroom — connecting as the daemon's superuser meant
    # a single runaway panel could, and did.
    user: grafana_ro
    editable: false
    secureJsonData:
      password: ${GRAFANA_RO_PASSWORD}
    jsonData:
      # Grafana 13's postgres FRONTEND reads the database from jsonData only;
      # the top-level `database:` field is legacy (backend still honors it,
      # which is why API queries pass while every PG panel errors
      # "no default database configured" in the UI without this key.
      database: spacetraders
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
